<body class="dark-theme admin-body">
  <div id="adminApp">
    <!-- Tela de login -->
    <div id="loginScreen" class="admin-login">
      <div class="login-card glass-panel">
        <div class="login-logo">
          <i class="fas fa-crown"></i>
          <span>EduNEXUS<span class="ai-badge">ADMIN</span></span>
        </div>
        <h2>Acesso Restrito</h2>

      </div>
    </div>

      <nav class="admin-nav glass-header">
        <div class="logo-area"><i class="fas fa-microchip"></i> Admin Nexus</div>
        <div class="admin-nav-links">
          <a href="#" class="nav-btn" style="background: var(--neon-cyan); color: #000;" onclick="window.location.href = '/'; setTimeout(() => location.reload(), 100);">← Voltar ao App</a>
          <button data-section="dashboard" class="nav-btn active"><i class="fas fa-chart-line"></i> Dashboard</button>
          <button data-section="apps" class="nav-btn"><i class="fas fa-cube"></i> Apps</button>
          <button data-section="courses" class="nav-btn"><i class="fas fa-graduation-cap"></i> Cursos</button>
          <button data-section="categories" class="nav-btn"><i class="fas fa-tags"></i> Categorias</button>
          <button id="logoutBtn" class="nav-btn"><i class="fas fa-sign-out-alt"></i> Sair</button>
        </div>
      </nav>

      <main class="admin-main" id="adminContent">
        <!-- Conteúdo dinâmico -->

    </div>
